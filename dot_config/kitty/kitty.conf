# General & Window
term xterm-256color
remember_window_size no
initial_window_width 100c
initial_window_height 30c
background_opacity 0.8
hide_window_decorations no

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Fonts
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Colors (Nord Scheme)
background #2E3440
foreground #D8DEE9
color0 #3B4252
color1 #BF616A
color2 #A3BE8C
color3 #EBCB8B
color4 #81A1C1
color5 #B48EAD
color6 #88C0D0
color7 #E5E9F0
color8 #4C566A
color9 #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# Selection & Clipboard
select_by_word_characters ,│`|:"' ()[]{}<>\t
copy_on_select on
#mouse_map right press ignore
#mouse_map right press ungrabbed kitten smart_paste.py

# Mouse & Cursor
cursor_shape underline
cursor_blink_interval 0
cursor_underline_thickness 0.15
mouse_hide_wait -1
mouse_map right press ungrabbed paste_from_clipboard
mouse_map middle release ungrabbed paste_from_selection

# Keyboard Bindings
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+l clear_terminal scrollback active
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
map ctrl+0 restore_font_size
